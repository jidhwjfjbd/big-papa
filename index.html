<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Telegram Mini App</title>
    <!-- مكتبة تلجرام الرسمية لتطبيقات الويب -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2 id="welcome">مرحباً بك! 👋</h2>
    <p>هذا أول تطبيق مصغر لك داخل تلجرام.</p>
    <button onclick="closeApp()">إغلاق التطبيق</button>

    <script>
        // تهيئة السكربت الخاص بتلجرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // توسيع الشاشة بالكامل

        // جلب اسم المستخدم من تلجرام وعرضه
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById("welcome").innerText = "مرحباً " + tg.initDataUnsafe.user.first_name + "! 👋";
        }

        function closeApp() {
            tg.close(); // إغلاق التطبيق المصغر
        }
    </script>
</body>
</html>
